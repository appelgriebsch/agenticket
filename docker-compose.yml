services:
  agenticket:
    build: .
    # or use a published image instead of build:
    # image: agenticket:latest
    ports:
      - "3547:3547"
    volumes:
      - agenticket-data:/data
    environment:
      # Set on first boot to enable human login to the web UI.
      AGENTICKET_ADMIN_PASSWORD: change-me
    restart: unless-stopped

volumes:
  agenticket-data:
