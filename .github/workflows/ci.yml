name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx tsx scripts/smoke-db.mjs
      - run: npx tsx scripts/smoke-mcp.mjs
      - run: npx tsx scripts/smoke-skill.mjs

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun scripts/smoke-db.mjs
      - run: bun scripts/smoke-mcp.mjs
      - run: bun scripts/smoke-skill.mjs
      - run: bash scripts/smoke-pack.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agenticket:ci .
      - name: container smoke
        run: |
          set -euo pipefail
          docker run -d --name agt -p 3547:3547 -v agt-data:/data \
            -e AGENTICKET_ADMIN_PASSWORD=ci-test agenticket:ci
          for i in $(seq 1 30); do
            curl -sf localhost:3547/healthz && break || sleep 1
          done
          curl -sf localhost:3547/healthz | grep -q '"ok":true'
          TOKEN=$(docker exec agt bun bin/agenticket.js token create smoke | grep -o 'agt_[A-Za-z0-9_-]*')
          curl -sf -X POST localhost:3547/mcp \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"create_project","arguments":{"key":"CI","name":"CI smoke"}}}' \
            | grep -q '"CI"'
          docker restart agt
          for i in $(seq 1 30); do
            curl -sf localhost:3547/healthz && break || sleep 1
          done
          curl -sf -X POST localhost:3547/mcp \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_projects","arguments":{}}}' \
            | grep -q '"CI"'
          docker rm -f agt
